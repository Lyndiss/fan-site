<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ampharos's cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="Normaletekst" id="Amph1">
      <h1 style="text-align: center">Who's that pokemon?</h1>
    </div>

    <div id="pokemonguess">
      <img
        id="pokemonimage"
        src="Images/Whosthatpokemonsilhouette.png"
        alt="Ampharosguess"
      />
    </div>

    <div id="transbox">
      <p class="textinbox">
        Can you guess which Pokemon this is?
        <br />
        <br />
        <!-- <button id="knop">knop</button> -->
        <input type="text" id="myInput" /><button id="myButton">Guess</button>
      </p>
    </div>

    <button id="knop2">Random fact</button>

    <div id="cards">
      <div class="card">
        <img src="Images/Kaartmareep.png" alt="Mareep kaart" />
        <p>Mareep</p>
      </div>
      <div class="card">
        <img src="Images/Kaartflaaffy.png" alt="Flaaffy kaart" />
        <p>Flaaffy</p>
      </div>
      <div class="card">
        <img src="Images/Kaartshinyex.png" alt="Mega Ampharos shiny ex" />
        <p>Mega Ampharos Shiny EX</p>
      </div>
      <div class="card">
        <img src="Images/Kaartfullart.png" alt="Mega Ampharos full art" />
        <p>Mega Ampharos Full Art</p>
      </div>
      <div class="card">
        <img
          src="Images/Kaartanderefull.png"
          alt="Mega Ampharos andere full art"
        />
        <p>Mega Ampharos Full Art 2</p>
      </div>
      <div class="card electric">
        <img src="Images/Kaartex.png" alt="Mega Ampharos ex" />
        <p>Mega Ampharos EX</p>
      </div>
    </div>

    <div id="backtohomepage">
      <a href="index.html">Back to homepage</a>
    </div>

    <script src="script.js"></script>
  </body>
</html>
